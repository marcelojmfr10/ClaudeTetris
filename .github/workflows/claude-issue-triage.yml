name: Claude Issue Triage

on:
  issues:
    types: [opened, edited]

jobs:
  triage:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Run Claude Issue Triage
        id: claude-triage
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          allowed_tools: 'Bash(gh issue *),Bash(gh label *)'
          prompt: |
            Analiza el issue #${{ github.event.issue.number }} de este repositorio.

            1. Revisa el título y la descripción del issue.
            2. Revisa las labels existentes en el repo con `gh label list` y aplica las que correspondan (tipo: bug/feature/enhancement/docs; prioridad; área afectada) usando `gh issue edit ${{ github.event.issue.number }} --add-label "..."`. No crees labels nuevas si ya existe una equivalente.
            3. Publica un comentario en el issue (`gh issue comment ${{ github.event.issue.number }} --body "..."`) con un diagnóstico general del problema:
               - Resumen del problema.
               - Posible causa raíz o área del código afectada (revisa game.js, index.html, style.css según corresponda).
               - Pasos sugeridos para implementar la solución (sin escribir el código todavía).

            No hagas cambios en el código ni abras PRs, esto es solo diagnóstico y etiquetado.
